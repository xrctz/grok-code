name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            vscode-mcp/extension/package-lock.json
            vscode-mcp/mcp-server/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Run tests
        run: npm test

      - name: Package UI extension
        run: npm run package:ui
